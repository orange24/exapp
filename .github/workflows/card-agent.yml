name: build card agent

# cgo ข้าม platform ไม่ได้ — ตัวอ่านบัตรเรียก winscard.dll บน Windows
# และ PCSC framework บน macOS จึงต้อง build บนเครื่องของแต่ละระบบจริง ๆ
# ที่นี่ build Windows เพราะไม่มีเครื่อง Windows ในมือ ส่วน macOS build เอง
on:
  push:
    tags: ['card-agent-v*']
    paths: ['agent/**', '.github/workflows/card-agent.yml']
  pull_request:
    paths: ['agent/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # อ่านจาก go.mod แทนการเขียนตายตัว
          #
          # เคยตรึงไว้ที่ 1.22 แล้วพอ go.mod ขยับเป็น 1.26 ตอนเพิ่มไลบรารีอ่าน
          # พาสปอร์ต workflow ก็ยังติดตั้ง 1.22 อยู่ — build พังโดยไม่มีใครนึกถึง
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      # ตัวอ่านฮาร์ดแวร์ต้องมี libpcsclite ถึงจะคอมไพล์ได้ แม้จะไม่มีเครื่องอ่านจริง
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: go test ./... -v
        working-directory: agent

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: build
        working-directory: agent
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#card-agent-}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"

          # build สองรอบโดยตั้งใจ
          #
          # ตัวที่แจกใช้ -H windowsgui กันหน้าต่าง console สีดำโผล่ตอนดับเบิลคลิก
          # แต่ธงนั้นทำให้โปรแกรมพิมพ์อะไรออกหน้าจอไม่ได้ ตรวจว่ารันขึ้นจริงไม่ได้
          #
          # จึง build ตัว console ขึ้นมาก่อนเพื่อรันพิสูจน์ว่ามันเริ่มทำงานได้
          # คอมไพล์ผ่านไม่ได้แปลว่าเปิดขึ้น และการแจกไฟล์ที่เปิดไม่ขึ้นไป 20 สาขา
          # จะรู้ตัวก็ตอนที่ทุกสาขาพยายามติดตั้งพร้อมกัน
          go build -ldflags "-X main.version=$VERSION" -o check.exe ./cmd/exapp-card-agent
          ./check.exe -version
          rm check.exe

          go build -ldflags "-s -w -H windowsgui -X main.version=$VERSION" \
            -o exapp-card-agent.exe ./cmd/exapp-card-agent

          test -s exapp-card-agent.exe

      - uses: actions/upload-artifact@v4
        with:
          name: exapp-card-agent-windows
          path: agent/exapp-card-agent.exe

  # macOS ต้อง build บนเครื่อง macOS เพราะ systray/PCSC ฝั่งนี้ใช้ cgo
  # (ฝั่ง Windows ไม่ใช้ จึง cross-compile ได้ แต่ build บน Windows จริงแน่นอนกว่า)
  build-macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: build
        working-directory: agent
        run: |
          VERSION="${GITHUB_REF_NAME#card-agent-}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"

          # ชื่อไฟล์ต้องตรงกับที่ตัวอัปเดตเองมองหา (internal/selfupdate assetName)
          GOARCH=${{ matrix.arch }} CGO_ENABLED=1 go build \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o exapp-card-agent-darwin-${{ matrix.arch }} ./cmd/exapp-card-agent

      - uses: actions/upload-artifact@v4
        with:
          name: exapp-card-agent-darwin-${{ matrix.arch }}
          path: agent/exapp-card-agent-darwin-${{ matrix.arch }}

  release:
    needs: [build-windows, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            exapp-card-agent.exe
            exapp-card-agent-darwin-amd64
            exapp-card-agent-darwin-arm64
