[www]
; Listen on TCP (not socket) for nginx
listen = 127.0.0.1:9000

; Run as www-data
user = www-data
group = www-data

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Clear env for Cloud Run (inherit env vars)
clear_env = no
